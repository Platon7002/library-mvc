<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<!-- Общие части страниц: подключаются через th:replace -->

<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' — Библиотека'">Библиотека</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>
<header th:fragment="navbar" class="navbar">
    <div class="container navbar-inner">
        <a class="brand" th:href="@{/}">📚 Библиотека</a>
        <nav class="menu">
            <a th:href="@{/}">Главная</a>
            <a th:href="@{/books}">Книги</a>
            <a th:href="@{/genres}">Жанры</a>
            <a class="btn btn-small" th:href="@{/books/new}">+ Добавить книгу</a>
        </nav>
    </div>
</header>

<!-- Сообщение об успешном действии (приходит из контроллера через flash-атрибут) -->
<div th:fragment="flash" th:if="${message != null}" class="alert alert-success" th:text="${message}">
    Сообщение
</div>

<footer th:fragment="footer" class="footer">
    <div class="container">Учебный проект · Spring MVC + Thymeleaf</div>
</footer>
</body>
</html>
