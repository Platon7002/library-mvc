<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Книги')}"></head>
<body>
<header th:replace="~{fragments/layout :: navbar}"></header>

<main class="container">
    <div th:replace="~{fragments/layout :: flash}"></div>
    <h1>Каталог книг</h1>

    <!-- Форма поиска: отправляется методом GET, параметры попадают в адрес -->
    <form class="search" method="get" th:action="@{/books}">
        <input type="text" name="q" th:value="${q}" placeholder="Название или автор">
        <select name="genre">
            <option value="">Все жанры</option>
            <option th:each="g : ${genres}" th:value="${g}" th:text="${g.title}"
                    th:selected="${g == selectedGenre}">Жанр</option>
        </select>
        <button class="btn" type="submit">Найти</button>
        <a class="btn btn-light" th:href="@{/books}">Сбросить</a>
    </form>

    <p class="muted">Найдено: <span th:text="${#lists.size(books)}">0</span></p>

    <p th:if="${#lists.isEmpty(books)}" class="empty">По вашему запросу ничего не найдено.</p>

    <table class="table" th:unless="${#lists.isEmpty(books)}">
        <thead>
        <tr>
            <th>№</th>
            <th>Название</th>
            <th>Автор</th>
            <th>Год</th>
            <th>Жанр</th>
            <th>Действия</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="b : ${books}">
            <td th:text="${b.id}">1</td>
            <td><a th:href="@{/books/{id}(id=${b.id})}" th:text="${b.title}">Название</a></td>
            <td th:text="${b.author}">Автор</td>
            <td th:text="${b.year}">2000</td>
            <td><span class="badge" th:text="${b.genre.title}">Жанр</span></td>
            <td class="actions">
                <a class="btn btn-small btn-light" th:href="@{/books/{id}/edit(id=${b.id})}">Изменить</a>
                <form method="post" th:action="@{/books/{id}/delete(id=${b.id})}"
                      onsubmit="return confirm('Удалить эту книгу?');">
                    <button class="btn btn-small btn-danger" type="submit">Удалить</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
