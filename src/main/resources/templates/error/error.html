<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Ошибка')}"></head>
<body>
<header th:replace="~{fragments/layout :: navbar}"></header>

<main class="container error-page">
    <div class="error-icon">⚠️</div>
    <h1>Ошибка <span th:text="${status ?: ''}">000</span></h1>
    <p th:text="${message ?: 'Не удалось выполнить запрос'}">Сообщение</p>
    <a class="btn" th:href="@{/}">На главную</a>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
